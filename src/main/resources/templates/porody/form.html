<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Порода</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5" style="max-width: 640px;">
    <div class="card p-4">
        <h3 class="mb-4" th:text="${poroda.idPorodi != null} ? 'Редактировать породу' : 'Добавить породу'">Добавить породу</h3>

        <form th:object="${poroda}" th:action="@{${poroda.idPorodi != null} ? '/porody/' + ${poroda.idPorodi} : '/porody'}" method="post">

            <!-- Ошибки валидации -->
            <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
                <ul class="mb-0">
                    <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
                </ul>
            </div>

            <!-- Скрытое поле ID -->
            <input type="hidden" th:field="*{idPorodi}" />

            <!-- Название породы -->
            <div class="mb-3">
                <label class="form-label">Название породы</label>
                <input type="text"
                       th:field="*{nazvanie}"
                       class="form-control"
                       placeholder="Британская короткошёрстная"
                       required />
            </div>

            <!-- Кнопки -->
            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-primary" th:text="${poroda.idPorodi != null} ? 'Обновить' : 'Сохранить'">Сохранить</button>
                <a href="/porody" class="btn btn-outline-secondary">Отмена</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
