<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Породы</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h3>Породы</h3>
    <a href="/porody/new" class="btn btn-primary mb-3">Добавить породу</a>
    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Название породы</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${porody}">
            <td th:text="${p.idPorodi}"></td>
            <td th:text="${p.nazvanie}"></td>
            <td>
                <a th:href="@{/porody/edit/{id}(id=${p.idPorodi})}" class="btn btn-sm btn-outline-secondary">Изменить</a>
                <a th:href="@{/porody/delete/{id}(id=${p.idPorodi})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Удалить породу?')">Удалить</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
