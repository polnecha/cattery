<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Форма осмотра</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --violet-900: #2d1b69;
            --violet-700: #4c3fb4;
            --violet-100: #f3f1fb;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--violet-100);
        }

        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0,0,0,.06);
        }

        .page-title {
            font-weight: 600;
            color: var(--violet-900);
        }

        .section-title {
            font-weight: 600;
            margin-top: 32px;
            margin-bottom: 16px;
            color: var(--violet-900);
        }

        .form-control, .form-select {
            border-radius: 10px;
            padding: 10px 14px;
        }

        .btn-primary {
            background: var(--violet-700);
            border: none;
            border-radius: 10px;
            padding: 10px 18px;
            font-weight: 500;
        }

        .btn-primary:hover {
            background: var(--violet-900);
        }
    </style>
</head>

<body>
<div class="container mt-5">
    <div class="card">
        <div class="card-body p-4">

            <h3 class="page-title mb-4">Добавить осмотр</h3>

            <form th:object="${osmotr}" th:action="@{/osmotry}" method="post">

                <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
                    <strong>Ошибки:</strong>
                    <ul class="mb-0">
                        <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
                    </ul>
                </div>

                <input type="hidden" th:field="*{idOsmotr}"/>

                <div class="mb-3">
                    <label class="form-label">Животное</label>
                    <select th:field="*{pet}" class="form-select" required>
                        <option value="">Выберите животное</option>
                        <option th:each="p : ${vsePets}"
                                th:value="${p.id}"
                                th:text="${p.name} + ' (' + ${p.ownerName} + ')'">
                        </option>
                    </select>
                </div>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Дата осмотра</label>
                        <input type="date" th:field="*{dataOsmotra}" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Ветеринар (ФИО)</label>
                        <input type="text" th:field="*{veterinarniyVrach}" class="form-control" required>
                    </div>
                </div>

                <div class="mt-3">
                    <label class="form-label">Причина визита</label>
                    <select th:field="*{prichinaVizita}" class="form-select" required>
                        <option value="">Выберите</option>
                        <option value="Плановый осмотр">Плановый осмотр</option>
                        <option value="Жалобы">Жалобы</option>
                        <option value="Вакцинация">Вакцинация</option>
                        <option value="Болезнь">Болезнь</option>
                        <option value="Другое">Другое</option>
                    </select>
                </div>

                <div class="row g-3 mt-1">
                    <div class="col-md-6">
                        <label class="form-label">Вес (кг)</label>
                        <input type="number" step="0.1" th:field="*{ves}" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Температура (°C)</label>
                        <input type="number" step="0.1" th:field="*{temperatura}" class="form-control">
                    </div>
                </div>

                <div class="mt-3">
                    <label class="form-label">Общее состояние</label>
                    <select th:field="*{obsheeSostoyanie}" class="form-select" required>
                        <option value="">Выберите</option>
                        <option value="Нормальное">Нормальное</option>
                        <option value="Вялое">Вялое</option>
                        <option value="Тяжёлое">Тяжёлое</option>
                    </select>
                </div>

                <h5 class="section-title">Осмотр по системам</h5>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Глаза</label>
                        <input type="text" th:field="*{glaza}" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Уши</label>
                        <input type="text" th:field="*{ushi}" class="form-control">
                    </div>
                </div>

                <div class="row g-3 mt-1">
                    <div class="col-md-6">
                        <label class="form-label">Зубы / дёсны</label>
                        <input type="text" th:field="*{zubyDesny}" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Кожа и шерсть</label>
                        <input type="text" th:field="*{kozhaSherst}" class="form-control">
                    </div>
                </div>

                <div class="row g-3 mt-1">
                    <div class="col-md-6">
                        <label class="form-label">Лимфоузлы</label>
                        <input type="text" th:field="*{limfouzly}" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Живот</label>
                        <input type="text" th:field="*{zhivot}" class="form-control">
                    </div>
                </div>

                <div class="mt-3">
                    <label class="form-label">Предварительный диагноз</label>
                    <textarea th:field="*{predvaritelnyDiagnoz}" class="form-control" rows="2" required></textarea>
                </div>

                <div class="mt-3">
                    <label class="form-label">Назначения</label>
                    <textarea th:field="*{naznacheniya}" class="form-control" rows="3"></textarea>
                </div>

                <div class="mt-3">
                    <label class="form-label">Дата следующего визита</label>
                    <input type="date" th:field="*{dataSleduyuschegoVizita}" class="form-control">
                </div>

                <div class="mt-3">
                    <label class="form-label">Комментарии врача</label>
                    <textarea th:field="*{kommentarii}" class="form-control" rows="2"></textarea>
                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Сохранить осмотр</button>
                    <a href="/osmotry" class="btn btn-outline-secondary">Отмена</a>
                </div>

            </form>
        </div>
    </div>
</div>
</body>
</html>
