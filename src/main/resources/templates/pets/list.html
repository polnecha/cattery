<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Животные</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --violet-700: #4c3fb4;
            --violet-900: #2d1b69;
            --violet-100: #f3f1fb;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--violet-100);
        }

        .page-title {
            font-weight: 600;
            color: var(--violet-900);
        }

        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0,0,0,.06);
        }

        .btn-primary {
            background: var(--violet-700);
            border: none;
            border-radius: 10px;
        }

        .btn-primary:hover {
            background: var(--violet-900);
        }

        .table thead {
            background: var(--violet-700);
            color: white;
        }
    </style>
</head>

<body>
<div class="container mt-5">

    <!-- Заголовок и кнопки навигации -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="page-title">Животные</h3>
        <div>
            <!-- Исправлено: ссылка ведет на контроллер /porody, а не на /templates/porody -->
            <a href="/porody" class="btn btn-outline-secondary me-2">Породы</a>
            <a href="/" class="btn btn-outline-secondary">Главная</a>
        </div>
    </div>

    <a href="/pets/new" class="btn btn-primary mb-3">Добавить животное</a>

    <div class="card">
        <div class="card-body">
            <table class="table align-middle">
                <thead>
                <tr>
                    <th>Кличка</th>
                    <th>Тип</th>
                    <th>Пол</th>
                    <th>Порода</th>
                    <th>Владелец</th>
                    <th>Телефон</th>

                    <th>Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="pet : ${pets}" th:object="${pet}">
                    <td th:text="*{name}"></td>
                    <td th:text="*{tipZhivotnogo}"></td>
                    <td th:text="*{gender}"></td>
                    <td th:text="*{breed?.nazvanie ?: '—'}"></td>
                    <td th:text="*{ownerName}"></td>
                    <td th:text="*{ownerPhone}"></td>
                    <td>
                        <!-- Кнопка для модального окна -->
                        <button type="button" class="btn btn-sm btn-outline-primary"
                                data-bs-toggle="modal"
                                th:data-bs-target="'#petModal-' + *{id}">
                            Показать
                        </button>
                        <a th:href="@{/pets/edit/{id}(id=*{id})}" class="btn btn-sm btn-outline-warning ms-1">Изменить</a>
                        <a th:href="@{/pets/delete/{id}(id=*{id})}" class="btn btn-sm btn-outline-danger ms-1"
                           onclick="return confirm('Удалить?')">Удалить</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Модальные окна для каждого животного -->
<div th:each="pet : ${pets}">
    <div class="modal fade" th:id="'petModal-' + ${pet.id}" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" th:text="'Животное: ' + ${pet.name}"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
                </div>
                <div class="modal-body">
                    <p><strong>Кличка:</strong> <span th:text="${pet.name}"></span></p>
                    <p><strong>Пол:</strong> <span th:text="${pet.gender}"></span></p>
                    <p><strong>Порода:</strong> <span th:text="${pet.breed?.nazvanie ?: '—'}"></span></p>
                    <p><strong>Дата рождения:</strong> <span th:text="${pet.birthDate ?: '—'}"></span></p>
                    <p><strong>Окрас:</strong> <span th:text="${pet.color}"></span></p>
                    <p><strong>Вес:</strong> <span th:text="${pet.weight} + ' кг'"></span></p>
                    <p><strong>Стерилизован:</strong> <span th:text="${pet.sterilized}"></span></p>
                    <p><strong>Особенности:</strong> <span th:text="${pet.notes ?: '—'}"></span></p>
                    <p><strong>Владелец:</strong> <span th:text="${pet.ownerName}"></span></p>
                    <p><strong>Телефон:</strong> <span th:text="${pet.ownerPhone}"></span></p>
                    <p><strong>Дата регистрации:</strong> <span th:text="${pet.registrationDate ?: '—'}"></span></p>
                </div>
                <div class="modal-footer">
                    <div>
                        <!-- Исправлено: ссылка на контроллер /porody -->
                        <a href="/porody" class="btn btn-outline-secondary me-2">Породы</a>
                        <a href="/" class="btn btn-outline-secondary">Главная</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
