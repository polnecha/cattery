<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Карточка животного</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --violet-700: #4c3fb4;
            --violet-900: #2d1b69;
            --violet-100: #f3f1fb;
            --gray-600: #6b7280;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--violet-100);
        }

        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0,0,0,.06);
        }

        .page-title {
            font-weight: 600;
            color: var(--violet-900);
        }

        .section-title {
            font-weight: 600;
            margin-top: 32px;
            margin-bottom: 16px;
            color: var(--violet-900);
        }

        .form-control, .form-select {
            border-radius: 10px;
            padding: 10px 14px;
        }

        .btn-primary {
            background: var(--violet-700);
            border: none;
            border-radius: 10px;
            padding: 10px 18px;
            font-weight: 500;
        }

        .btn-primary:hover {
            background: var(--violet-900);
        }
    </style>
</head>

<body>
<div class="container mt-5">
    <div class="card">
        <div class="card-body p-4">

            <h3 class="page-title mb-4">Добавить животное</h3>

            <form th:object="${pet}" th:action="@{/pets}" method="post">

                <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
                    <strong>Ошибки:</strong>
                    <ul class="mb-0">
                        <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
                    </ul>
                </div>

                <input type="hidden" th:field="*{id}"/>

                <!-- Основное -->
                <div class="mb-3">
                    <label class="form-label">Тип животного</label>
                    <select th:field="*{tipZhivotnogo}" class="form-control" required>
                        <option value="">Выберите</option>
                        <option value="Кошка">Кошка</option>
                        <option value="Собака">Собака</option>
                        <option value="Кролик">Кролик</option>
                        <option value="Хомяк">Хомяк</option>
                        <option value="Попугай">Попугай</option>
                        <option value="Другое">Другое</option>
                    </select>
                </div>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Кличка</label>
                        <input type="text" th:field="*{name}" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Пол</label>
                        <select th:field="*{gender}" class="form-select" required>
                            <option value="">Выберите</option>
                            <option value="М">М</option>
                            <option value="Ж">Ж</option>
                        </select>
                    </div>
                </div>

                <div class="row g-3 mt-1">
                    <div class="col-md-6">
                        <label class="form-label">Дата рождения</label>
                        <input type="date" th:field="*{birthDate}" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Порода</label>
                        <select th:field="*{breed}" class="form-select" required>
                            <option value="">Выберите породу</option>
                            <option th:each="p : ${vsePorody}"
                                    th:value="${p.idPorodi}"
                                    th:text="${p.nazvanie}">
                            </option>
                        </select>
                    </div>
                </div>

                <div class="row g-3 mt-1">
                    <div class="col-md-6">
                        <label class="form-label">Окрас</label>
                        <input type="text" th:field="*{color}" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Вес (кг)</label>
                        <input type="number" step="0.1" th:field="*{weight}" class="form-control" required>
                    </div>
                </div>

                <div class="row g-3 mt-1">
                    <div class="col-md-6">
                        <label class="form-label">Стерилизован?</label>
                        <select th:field="*{sterilized}" class="form-select" required>
                            <option value="">Выберите</option>
                            <option value="да">Да</option>
                            <option value="нет">Нет</option>
                        </select>
                    </div>
                </div>

                <!-- Владелец -->
                <h5 class="section-title">Владелец</h5>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">ФИО владельца</label>
                        <input type="text" th:field="*{ownerName}" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Телефон</label>
                        <input type="text" th:field="*{ownerPhone}" class="form-control" required>
                    </div>
                </div>

                <div class="mt-3">
                    <label class="form-label">Особые отметки</label>
                    <textarea th:field="*{notes}" class="form-control" rows="3"></textarea>
                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                    <a href="/pets" class="btn btn-outline-secondary">Отмена</a>
                </div>

            </form>
        </div>
    </div>
</div>
</body>
</html>
