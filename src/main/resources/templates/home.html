<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ветеринарная клиника</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Inter font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --violet-900: #2d1b69;
            --violet-700: #4c3fb4;
            --violet-500: #6f63d8;
            --violet-100: #f3f1fb;
            --gray-600: #6b7280;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--violet-100);
            color: #111827;
        }

        .page-subtitle {
            color: var(--gray-600);
        }

        .card {
            border: none;
            border-radius: 14px;
            background-color: #ffffff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
        }

        .card-title {
            font-weight: 600;
        }

        .card-text {
            color: var(--gray-600);
        }

        .card-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--violet-700), var(--violet-500));
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }

        .card-icon svg {
            width: 24px;
            height: 24px;
        }

        .btn-primary {
            background-color: var(--violet-700);
            border: none;
            border-radius: 10px;
            padding: 10px 18px;
            font-weight: 500;
        }

        .btn-primary:hover {
            background-color: var(--violet-900);
        }

        .form-control {
            border-radius: 10px;
            padding: 10px 14px;
        }

        .section-title {
            font-weight: 600;
            margin-bottom: 16px;
        }
    </style>
</head>

<body>
<div class="container mt-5">

    <!-- Заголовок -->
    <div class="text-center mb-5">
        <p class="lead page-subtitle">
            Система учёта животных, осмотров и прививок
        </p>
    </div>

    <!-- Карточки -->
    <div class="row g-4 justify-content-center">

        <!-- Животные -->
        <div class="col-md-4">
            <div class="card h-100">
                <div class="card-body text-center">
                    <div class="card-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <path d="M4 12h16M12 4v16" stroke="white" stroke-width="2" fill="none"/>
                        </svg>
                    </div>
                    <h5 class="card-title">Животные</h5>
                    <p class="card-text">Карточки пациентов</p>
                    <a href="/pets" class="btn btn-primary">Перейти</a>
                </div>
            </div>
        </div>

        <!-- Прививки -->
        <div class="col-md-4">
            <div class="card h-100">
                <div class="card-body text-center">
                    <div class="card-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <path d="M4 12h16M12 4v16" stroke="white" stroke-width="2" fill="none"/>
                        </svg>
                    </div>
                    <h5 class="card-title">Прививки</h5>
                    <p class="card-text">История вакцинации</p>
                    <a href="/vakciny" class="btn btn-primary">Перейти</a>
                </div>
            </div>
        </div>

        <!-- Осмотры -->
        <div class="col-md-4">
            <div class="card h-100">
                <div class="card-body text-center">
                    <div class="card-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <path d="M4 12h16M12 4v16" stroke="white" stroke-width="2" fill="none"/>
                        </svg>
                    </div>
                    <h5 class="card-title">Осмотры</h5>
                    <p class="card-text">Медицинские осмотры</p>
                    <a href="/osmotry" class="btn btn-primary">Перейти</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Поиск -->
    <div class="row mt-4">
        <div class="col-md-6 mx-auto">
            <form th:action="@{/search}" method="get" class="d-flex gap-2">
                <input type="text" name="q" class="form-control"
                       placeholder="Поиск по котам, осмотрам, прививкам..." required>
                <button type="submit" class="btn btn-primary">Найти</button>
            </form>
        </div>
    </div>

    <!-- Отчёт -->
    <div class="row mt-5">
        <div class="col-md-6 mx-auto">
            <div class="card">
                <div class="card-body">
                    <h5 class="section-title">Скачать отчёт по осмотрам</h5>
                    <form th:action="@{/report/osmotry}" method="post" class="row g-3">
                        <div class="col-md-5">
                            <label class="form-label">С</label>
                            <input type="date" name="startDate" class="form-control" required>
                        </div>
                        <div class="col-md-5">
                            <label class="form-label">По</label>
                            <input type="date" name="endDate" class="form-control" required>
                        </div>
                        <div class="col-md-2 d-flex align-items-end">
                            <button type="submit" class="btn btn-primary w-100">
                                Excel
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
