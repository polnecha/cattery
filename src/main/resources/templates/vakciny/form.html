<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Прививка</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --violet-900: #2d1b69;
            --violet-700: #4c3fb4;
            --violet-100: #f3f1fb;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--violet-100);
        }

        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0,0,0,.06);
        }

        .page-title {
            font-weight: 600;
            color: var(--violet-900);
        }

        .form-control, .form-select {
            border-radius: 10px;
            padding: 10px 14px;
        }

        .btn-primary {
            background: var(--violet-700);
            border: none;
            border-radius: 10px;
            padding: 10px 18px;
            font-weight: 500;
        }

        .btn-primary:hover {
            background: var(--violet-900);
        }
    </style>
</head>

<body>
<div class="container mt-5">
    <div class="card">
        <div class="card-body p-4">

            <h3 class="page-title mb-4">Добавить прививку</h3>

            <form th:object="${vakcina}" th:action="@{/vakciny}" method="post">

                <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
                    <strong>Ошибки:</strong>
                    <ul class="mb-0">
                        <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
                    </ul>
                </div>

                <input type="hidden" th:field="*{idVakcina}" />

                <div class="mb-3">
                    <label class="form-label">Животное</label>
                    <select th:field="*{pet}" class="form-select" required>
                        <option value="">Выберите животное</option>
                        <option th:each="p : ${vsePets}"
                                th:value="${p.id}"
                                th:text="${p.name} + ' (' + ${p.ownerName} + ')'">
                        </option>
                    </select>
                </div>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Vaccine Name</label>
                        <select th:field="*{nazvanieVakciny}" class="form-select" required>
                            <option value="">Select a vaccine</option>
                            <option value="Rabies">Rabies</option>
                            <option value="FVRCP">FVRCP (Feline Viral Rhinotracheitis, Calicivirus, Panleukopenia)</option>
                            <option value="Leukemia">Feline Leukemia</option>
                            <option value="Distemper">Canine Distemper</option>
                            <option value="Parvovirus">Canine Parvovirus</option>
                            <option value="Bordetella">Bordetella (Kennel Cough)</option>
                        </select>
                    </div>


                    <div class="col-md-6">
                        <label class="form-label">Тип вакцины</label>
                        <select th:field="*{tipVakciny}" class="form-select" required>
                            <option value="">Выберите</option>
                            <option value="Комплексная">Комплексная</option>
                            <option value="Бешенство">Бешенство</option>
                            <option value="Лейкемия">Лейкемия</option>
                            <option value="Другое">Другое</option>
                        </select>
                    </div>
                </div>

                <div class="row g-3 mt-1">
                    <div class="col-md-6">
                        <label class="form-label">Дата постановки</label>
                        <input type="date" th:field="*{dataPostanovki}" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Следующая вакцинация</label>
                        <input type="date" th:field="*{dataSleduyuscheyVakcinacii}" class="form-control" required>
                    </div>
                </div>

                <div class="row g-3 mt-1">
                    <div class="col-md-6">
                        <label class="form-label">Серия / партия</label>
                        <input type="text" th:field="*{seriyaPartiya}" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Реакция</label>
                        <select th:field="*{reakciya}" class="form-select" required>
                            <option value="">Выберите</option>
                            <option value="Норма">Норма</option>
                            <option value="Осложнения">Осложнения</option>
                        </select>
                    </div>
                </div>

                <div class="mt-3">
                    <label class="form-label">Ветеринар (ФИО)</label>
                    <select th:field="*{veterinarniyVrach}" class="form-select" required>
                        <option value="">Выберите ветеринара</option>
                        <option value="Петрова Анна Сергеевна">Петрова Анна Сергеевна</option>
                        <option value="Смирнов Иван Алексеевич">Смирнов Иван Алексеевич</option>
                        <option value="Соколова Ольга Владимировна">Соколова Ольга Владимировна</option>
                        <option value="Иванов Дмитрий Николаевич">Иванов Дмитрий Николаевич</option>
                        <option value="Морозова Екатерина Андреевна">Морозова Екатерина Андреевна</option>
                    </select>
                </div>



                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Сохранить прививку</button>
                    <a href="/vakciny" class="btn btn-outline-secondary">Отмена</a>
                </div>

            </form>
        </div>
    </div>
</div>
</body>
</html>
