<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Прививки</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --violet-900: #2d1b69;
            --violet-700: #4c3fb4;
            --violet-100: #f3f1fb;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--violet-100);
        }

        .page-title {
            font-weight: 600;
            color: var(--violet-900);
        }

        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0,0,0,.06);
        }

        .btn-primary {
            background: var(--violet-700);
            border: none;
            border-radius: 10px;
        }

        .table thead {
            background: var(--violet-700);
            color: #fff;
        }
    </style>
</head>

<body>
<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="page-title">Прививки</h3>
        <a href="/" class="btn btn-outline-secondary">Главная</a>
    </div>

    <a href="/vakciny/new" class="btn btn-primary mb-3">Добавить прививку</a>

    <div class="card">
        <div class="card-body">
            <table class="table align-middle">
                <thead>
                <tr>
                    <th>Животное</th>
                    <th>Вакцина</th>
                    <th>Тип</th>
                    <th>Дата</th>
                    <th>Следующая</th>
                    <th>Ветеринар</th>
                    <th>Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="v : ${vakciny}" th:object="${v}">
                    <td th:text="*{pet.name}"></td>
                    <td th:text="*{nazvanieVakciny}"></td>
                    <td th:text="*{tipVakciny}"></td>
                    <td th:text="*{dataPostanovki}"></td>
                    <td th:text="*{dataSleduyuscheyVakcinacii}"></td>
                    <td th:text="*{veterinarniyVrach}"></td>
                    <td>
                        <!-- Кнопка вызывает модальное окно -->
                        <button type="button" class="btn btn-sm btn-outline-primary"
                                data-bs-toggle="modal"
                                th:data-bs-target="'#vakModal-' + *{idVakcina}">
                            Показать
                        </button>

                        <a th:href="@{/vakciny/edit/{id}(id=*{idVakcina})}"
                           class="btn btn-sm btn-outline-warning ms-1">Изменить</a>
                        <a th:href="@{/vakciny/delete/{id}(id=*{idVakcina})}"
                           class="btn btn-sm btn-outline-danger ms-1"
                           onclick="return confirm('Удалить прививку?')">Удалить</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Модальные окна для каждой прививки -->
<div th:each="v : ${vakciny}">
    <div class="modal fade" th:id="'vakModal-' + ${v.idVakcina}" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" th:text="'Прививка: ' + ${v.nazvanieVakciny}"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
                </div>
                <div class="modal-body">
                    <p><strong>Животное:</strong> <span th:text="${v.pet.name}"></span></p>
                    <p><strong>Тип:</strong> <span th:text="${v.tipVakciny}"></span></p>
                    <p><strong>Дата постановки:</strong> <span th:text="${v.dataPostanovki}"></span></p>
                    <p><strong>Следующая вакцинация:</strong> <span th:text="${v.dataSleduyuscheyVakcinacii}"></span></p>
                    <p><strong>Ветеринар:</strong> <span th:text="${v.veterinarniyVrach}"></span></p>
                    <p><strong>Серия / партия:</strong> <span th:text="${v.seriyaPartiya} ?: '—'"></span></p>
                    <p><strong>Реакция:</strong> <span th:text="${v.reakciya}"></span></p>
                    <p><strong>Время действия:</strong> <span th:text="${v.vremyaDeystviya} ?: '—'"></span></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
